[package]
name = "duckyctl"
version = "0.1.0"
edition = "2024"
description = "A CLI app for controlling the duckyPad via HID"

[dependencies]
chrono = "0.4"
clap = { version = "4.6", features = [ "derive" ] }
hidapi = "2.6"
strum = { version = "0.28", features = [ "derive" ]}
strum_macros = "0.28"
thiserror = "2"