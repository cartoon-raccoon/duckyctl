[package]
name = "duckyctl"
authors = [ "Sam Chan" ]
repository = "https://github.com/cartoon-raccoon/duckyctl"
license = "GPL-3.0"
version = "0.1.1"
edition = "2024"
description = "A CLI app for controlling the duckyPad via HID"

[dependencies]
chrono = "0.4"
clap = { version = "4.6", features = [ "derive" ] }
env_logger = "0.11"
hidapi = "2.6"
log = "0.4"
strum = { version = "0.28", features = [ "derive" ] }
strum_macros = "0.28"
thiserror = "2"